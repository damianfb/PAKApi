<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>PAK - Transporte de Pacientes</mat-card-title>
      <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input 
            matInput 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            required
            [disabled]="loading()">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input 
            matInput 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            required
            [disabled]="loading()">
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          class="full-width"
          [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Iniciar Sesión
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
