<div class="auth-container">
  <div class="auth-card">
    <!-- Logo & Branding -->
    <div class="auth-header">
      <div class="logo-icon">
        <i class="fas fa-ambulance"></i>
      </div>
      <h1 class="brand-title">PAK Traslados</h1>
      <p class="brand-subtitle">Crear nueva cuenta</p>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Correo electrónico</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input 
            type="email" 
            id="email"
            class="form-input with-icon"
            placeholder="ejemplo@empresa.com"
            [(ngModel)]="email" 
            name="email"
            required
            [disabled]="loading()">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password"
            class="form-input with-icon"
            placeholder="Mínimo 6 caracteres"
            [(ngModel)]="password" 
            name="password"
            required
            [disabled]="loading()">
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            tabindex="-1">
            <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input 
            [type]="showConfirmPassword() ? 'text' : 'password'" 
            id="confirmPassword"
            class="form-input with-icon"
            placeholder="Repite la contraseña"
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            required
            [disabled]="loading()">
          <button 
            type="button" 
            class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()"
            tabindex="-1">
            <i [class]="showConfirmPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-info">
        <i class="fas fa-info-circle"></i>
        <span>Al registrarte, recibirás un correo de confirmación.</span>
      </div>

      <button 
        type="submit"
        class="btn btn-primary btn-lg btn-block"
        [disabled]="loading()">
        @if (loading()) {
          <i class="fas fa-spinner fa-spin"></i>
          <span>Creando cuenta...</span>
        } @else {
          <i class="fas fa-user-plus"></i>
          <span>Crear Cuenta</span>
        }
      </button>
    </form>

    <!-- Login Link -->
    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a [routerLink]="['/login']" class="login-link">Iniciar sesión</a></p>
    </div>
  </div>

  <!-- Background decoration -->
  <div class="auth-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>
</div>
